name: VOICEVOX integration CI
on:
  push:
    branches: [codex/voicevox-ci]
permissions:
  contents: read
jobs:
  python:
    if: github.repository == 'yukincom/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.11 --extra dev --extra voice --extra tts-premium --extra edge-tts
      - run: scripts/run_tests.sh tests/tools/test_tts_streaming.py tests/tools/test_voicevox_streaming.py tests/hermes_cli/test_web_server_speak_stream.py -j 2
        env:
          HERMES_TEST_FILE_RETRIES: '0'
      - run: python3 scripts/check-windows-footguns.py tools/tts_streaming.py hermes_cli/web_routers/audio.py tests/tools/test_voicevox_streaming.py
  desktop:
    if: github.repository == 'yukincom/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm install -g npm@12
      - run: npm ci
      - name: Voice regression tests
        run: npm run test:ui --workspace apps/desktop -- src/lib/voice-playback.stream.test.ts src/app/chat/composer/hooks/use-auto-speak-replies.test.tsx src/app/chat/composer/hooks/use-voice-conversation.test.tsx src/app/chat/composer/hooks/use-voice-conversation-rearm.test.tsx src/store/voice-prefs.test.ts
      - name: Typecheck
        run: npm run typecheck --workspace apps/desktop
      - name: Lint changed voice code
        working-directory: apps/desktop
        run: npx eslint src/lib/voice-playback.ts src/lib/voice-playback.stream.test.ts src/app/chat/composer/hooks/use-auto-speak-replies.ts src/app/chat/composer/hooks/use-auto-speak-replies.test.tsx src/app/chat/composer/hooks/use-composer-voice.ts src/app/chat/composer/hooks/use-voice-conversation.ts src/app/chat/composer/hooks/use-voice-conversation.test.tsx src/app/chat/composer/hooks/use-voice-conversation-rearm.test.tsx
      - name: Build Desktop renderer
        working-directory: apps/desktop
        run: npx vite build
